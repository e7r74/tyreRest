!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <title>Tyres Shop</title>

  <link th:href="@{'https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css'}"
        rel="stylesheet">

  <script th:src="@{'https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js'}"></script>

  <script th:src="@{'https://code.jquery.com/jquery-3.7.1.min.js'}"></script>

  <script type="text/javascript" th:src="@{'/js/ajax.js'}"></script>
</head>

<body>

<div class="container">
  <div class="row">
    <div class="col-md-12">

      <nav class="navbar navbar-expand-lg bg-danger" data-bs-theme="dark">
        <div class="container-fluid">
          <a class="navbar-brand" th:href="@{'/'}">Tyres Shop</a>

          <button class="navbar-toggler"
                  type="button"
                  data-bs-toggle="collapse"
                  data-bs-target="#navbarNav"
                  aria-controls="navbarNav"
                  aria-expanded="false"
                  aria-label="Toggle navigation">
            <span class="navbar-toggler-icon"></span>
          </button>

          <div class="collapse navbar-collapse" id="navbarNav">
            <ul class="navbar-nav">
              <li class="nav-item">
                <a class="nav-link active" aria-current="page" th:href="@{'/'}">
                  Home
                </a>
              </li>

              <li class="nav-item">
                <a class="nav-link" th:href="@{'/'}">
                  All tyres
                </a>
              </li>
            </ul>
          </div>
        </div>
      </nav>

    </div>
  </div>
</div>

<div class="container mt-4">
  <div class="row">
    <div class="col-md-12">

      <div class="card px-3 py-3 mb-3 mx-2">
        <h4 class="mb-3">
          <span id="tyre-form-status">Add</span> Tyre
        </h4>

        <input type="hidden" id="tyre-id-input">

        <div class="d-flex flex-wrap gap-3">

          <div class="form-floating">
            <input type="text"
                   class="form-control"
                   id="tyre-name-input"
                   placeholder="tyre-name-input"
                   required>
            <label for="tyre-name-input">Name</label>
          </div>

          <div class="form-floating">
            <input type="text"
                   class="form-control"
                   id="tyre-profile-input"
                   placeholder="tyre-profile-input"
                   required>
            <label for="tyre-profile-input">Profile</label>
          </div>

          <div class="form-floating">
            <input type="number"
                   class="form-control"
                   id="tyre-price-input"
                   placeholder="tyre-price-input"
                   required>
            <label for="tyre-price-input">Price</label>
          </div>

          <div class="form-floating">
            <input type="text"
                   class="form-control"
                   id="tyre-manufacturer-input"
                   placeholder="tyre-manufacturer-input"
                   required>
            <label for="tyre-manufacturer-input">Manufacturer</label>
          </div>

          <button type="button"
                  class="btn btn-success"
                  onclick="saveTyre()">
            SAVE
          </button>

        </div>
      </div>

      <div id="server-response-message-label"></div>

      <div id="table-of-tyres">
        <table class="table table-striped">
          <thead class="table-warning">
          <tr>
            <th>ID</th>
            <th>Name</th>
            <th>Profile</th>
            <th>Price</th>
            <th>Manufacturer</th>
            <th colspan="2">Action</th>
          </tr>
          </thead>

          <tbody id="content-of-tyres-table">
          </tbody>
        </table>
      </div>

    </div>
  </div>
</div>

<div class="container-fluid bg-dark text-light mt-4">
  <div class="row py-3">
    <div class="col-12 text-center">
      <span>Copyright &copy; All Rights Reserved</span>
    </div>
  </div>
</div>

</body>
</html>
